<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <link id="favicon" rel="icon" href="/icon-light.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-dark-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icon-dark-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#efeee8" />
    <meta
      name="description"
      content="MyFinances — ingresos, gastos y gastos fijos del mes, con el saldo final que te queda de verdad."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&family=Sora:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>MyFinances</title>
    <script>
      // Aplica el tema guardado antes del primer paint — sin esto, la app arranca siempre en
      // claro y "parpadea" a oscuro un instante después de hidratar (ver `useTheme`, que es la
      // fuente de verdad en runtime; esto sólo evita el flash inicial leyendo el mismo storage key).
      // El favicon sigue el mismo toggle, no el tema del sistema operativo — por eso se resuelve
      // acá también, en vez de con `prefers-color-scheme` en el <link>.
      try {
        if (localStorage.getItem('theme:dark') === '1') {
          document.documentElement.dataset.theme = 'dark'
          document.getElementById('favicon').href = '/icon-dark.svg'
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
