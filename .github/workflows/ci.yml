name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancela la corrida anterior de la misma rama/PR si llega un push nuevo — evita gastar minutos en
# un resultado que ya quedó obsoleto.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Misma fuente de verdad que usa Cloudflare Pages para el deploy — así CI nunca
          # verifica con una versión de Node distinta de la que corre en producción.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
